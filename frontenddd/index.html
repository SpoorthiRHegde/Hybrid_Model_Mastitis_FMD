<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disease Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Step 1: Disease Selection -->
    <div id="step1" class="step active">
      <h1>Disease Detection</h1>
      <label for="disease">Choose Disease:</label>
      <select id="disease" required>
        <option value="">--Select--</option>
        <option value="mastitis">Mastitis</option>
        <option value="fmd">Foot and Mouth Disease (FMD)</option>
      </select>
      <div class="button-group">
        <button id="next1" class="next-btn">Next</button>
      </div>
    </div>

    <!-- Step 2: Input Type Selection -->
    <div id="step2" class="step hidden">
      <h2 id="step2-title">Select Input Type</h2>
      
      <!-- Mastitis Input -->
      <div id="mastitis-input" class="hidden">
        <label for="input-type">Input Type:</label>
        <select id="input-type" required>
          <option value="">--Select--</option>
          <option value="text">Text</option>
          <option value="image">Image</option>
          <option value="both">Both</option>
        </select>
      </div>
      
      <!-- FMD Input -->
      <div id="fmd-input" class="hidden">
        <h3>Select Input Options:</h3>
        <div class="checkbox-group">
          <label><input type="checkbox" id="foot-text" name="foot-text"> Foot Text Data</label>
          <label><input type="checkbox" id="mouth-text" name="mouth-text"> Mouth Text Data</label>
          <label><input type="checkbox" id="foot-image" name="foot-image"> Foot Image</label>
          <label><input type="checkbox" id="mouth-image" name="mouth-image"> Mouth Image</label>
        </div>
      </div>
      
      <div class="button-group">
        <button id="prev2" class="prev-btn">Back</button>
        <button id="next2" class="next-btn">Next</button>
      </div>
    </div>

    <!-- Step 3: Input Fields -->
    <div id="step3" class="step hidden">
      <h2 id="step3-title">Provide Input Data</h2>
      
      <!-- Mastitis Text -->
      <div id="mastitis-text-fields" class="input-section hidden">
        <h3>Mastitis Text Data</h3>
        <label>Temperature (°C): <input type="number" id="temperature" min="30" max="45" step="0.1"></label>
        <label>Hardness (0-5): <input type="number" id="hardness" min="0" max="5"></label>
        <label>Pain (0-5): <input type="number" id="pain" min="0" max="5"></label>
        <label>Milk Yield (0-5): <input type="number" id="milk_yield" min="0" max="5"></label>
        <label>Milk Color (0-5): <input type="number" id="milk_color" min="0" max="5"></label>
      </div>

      <!-- Mastitis Image -->
      <div id="mastitis-image-field" class="input-section hidden">
        <h3>Mastitis Image</h3>
        <input type="file" id="mastitis-image" accept="image/*">
      </div>

      <!-- FMD Foot Text -->
      <div id="fmd-foot-text-fields" class="input-section hidden">
        <h3>FMD Foot Text Data</h3>
        <label>Temperature (°C): <input type="number" id="ft_temp" min="30" max="45" step="0.1"></label>
        <label>Milk Yield (0-5): <input type="number" id="ft_milk" min="0" max="5"></label>
        <label>Lethargy (0/1): <input type="number" id="ft_lethargy" min="0" max="1"></label>
        <label>Difficulty Walking (0/1): <input type="number" id="ft_walk" min="0" max="1"></label>
        <label>Foot Blister (0-5): <input type="number" id="ft_blister" min="0" max="5"></label>
        <label>Foot Swelling (0-5): <input type="number" id="ft_swelling" min="0" max="5"></label>
        <label>Hoof Detachment (0-5): <input type="number" id="ft_hoof" min="0" max="5"></label>
      </div>

      <!-- FMD Mouth Text -->
      <div id="fmd-mouth-text-fields" class="input-section hidden">
        <h3>FMD Mouth Text Data</h3>
        <label>Temperature (°C): <input type="number" id="mt_temp" min="30" max="45" step="0.1"></label>
        <label>Milk Yield (0-5): <input type="number" id="mt_milk" min="0" max="5"></label>
        <label>Lethargy (0/1): <input type="number" id="mt_lethargy" min="0" max="1"></label>
        <label>Mouth Ulcers (0-5): <input type="number" id="mt_ulcers" min="0" max="5"></label>
        <label>Mouth Blister (0-5): <input type="number" id="mt_blister" min="0" max="5"></label>
        <label>Salivation (0/1): <input type="number" id="mt_salivation" min="0" max="1"></label>
        <label>Nasal Discharge (0/1): <input type="number" id="mt_discharge" min="0" max="1"></label>
      </div>

      <!-- FMD Foot Image -->
      <div id="fmd-foot-image-field" class="input-section hidden">
        <h3>FMD Foot Image</h3>
        <input type="file" id="foot-image" accept="image/*">
      </div>

      <!-- FMD Mouth Image -->
      <div id="fmd-mouth-image-field" class="input-section hidden">
        <h3>FMD Mouth Image</h3>
        <input type="file" id="mouth-image" accept="image/*">
      </div>

      <div class="button-group">
        <button id="prev3" class="prev-btn">Back</button>
        <button id="submit-btn" class="submit-btn">Detect Disease</button>
      </div>
    </div>

    <!-- Step 4: Results -->
    <div id="step4" class="step hidden">
      <h2>Detection Results</h2>
      <div id="result" class="result-box">
        <p>Processing your request...</p>
      </div>
      <div class="button-group">
        <button id="restart-btn" class="submit-btn">Start New Detection</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
